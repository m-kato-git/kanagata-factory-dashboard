<!DOCTYPE html>

<script>
// =========================================
// MINI CHART LIBRARY (pure Canvas, no CDN)
// =========================================
const MiniChart = {
  _instances: {},
  destroy(id) { delete this._instances[id]; },
  destroyAll() { this._instances = {}; },

  // Vertical bar chart
  bar(canvasId, {labels, datasets, options={}}) {
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth || 600;
    const H = canvas.height = parseInt(canvas.getAttribute('height'))||200;
    ctx.clearRect(0,0,W,H);
    const pad = {top:16, right:16, bottom:48, left:36};
    const chartW = W - pad.left - pad.right;
    const chartH = H - pad.top - pad.bottom;
    const n = labels.length;
    const groupW = chartW / n;
    const bw = Math.min(groupW * 0.6 / datasets.length, 40);
    // Find max
    let maxV = options.max || Math.max(...datasets.flatMap(d=>d.data)) * 1.15;
    // Grid lines
    ctx.strokeStyle = '#2a3555'; ctx.lineWidth = 1;
    for(let i=0;i<=4;i++){
      const y = pad.top + chartH * (1 - i/4);
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left+chartW, y); ctx.stroke();
      ctx.fillStyle='#64748b'; ctx.font='10px sans-serif'; ctx.textAlign='right';
      ctx.fillText(Math.round(maxV*i/4), pad.left-4, y+3);
    }
    // Bars
    datasets.forEach((ds, di) => {
      ds.data.forEach((val, i) => {
        const x = pad.left + i * groupW + (groupW - bw * datasets.length) / 2 + di * bw;
        const barH = (val / maxV) * chartH;
        const y = pad.top + chartH - barH;
        const color = Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : ds.backgroundColor;
        ctx.fillStyle = color || '#3b82f6';
        const r = 3;
        ctx.beginPath();
        ctx.moveTo(x+r, y); ctx.lineTo(x+bw-r, y);
        ctx.quadraticCurveTo(x+bw, y, x+bw, y+r);
        ctx.lineTo(x+bw, y+barH); ctx.lineTo(x, y+barH);
        ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
        ctx.fill();
      });
    });
    // X labels
    ctx.fillStyle='#64748b'; ctx.font='10px sans-serif'; ctx.textAlign='center';
    labels.forEach((lbl, i) => {
      const x = pad.left + i * groupW + groupW / 2;
      ctx.fillText(lbl.length>8?lbl.substring(0,8)+'…':lbl, x, H - 8);
    });
    // Legend
    if(datasets.length > 1) {
      let lx = pad.left;
      datasets.forEach(ds => {
        const c = Array.isArray(ds.backgroundColor)?ds.backgroundColor[0]:ds.backgroundColor;
        ctx.fillStyle = c; ctx.fillRect(lx, 4, 10, 8);
        ctx.fillStyle='#94a3b8'; ctx.font='10px sans-serif'; ctx.textAlign='left';
        ctx.fillText(ds.label||'', lx+13, 12);
        lx += (ds.label||'').length * 7 + 24;
      });
    }
  },

  // Donut chart
  doughnut(canvasId, {labels, datasets}) {
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth || 300;
    const H = canvas.height = parseInt(canvas.getAttribute('height'))||200;
    ctx.clearRect(0,0,W,H);
    const data = datasets[0].data;
    const colors = datasets[0].backgroundColor || ['#3b82f6','#22c55e','#eab308','#ef4444'];
    const total = data.reduce((a,b)=>a+b,0);
    const cx = W * 0.38, cy = H/2, r = Math.min(cx, cy) * 0.85, innerR = r * 0.6;
    let angle = -Math.PI/2;
    data.forEach((val, i) => {
      const slice = (val/total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, angle, angle+slice);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      angle += slice;
    });
    // Inner circle (donut hole)
    ctx.beginPath(); ctx.arc(cx, cy, innerR, 0, Math.PI*2);
    ctx.fillStyle = '#1a2035'; ctx.fill();
    // Center text
    ctx.fillStyle='#e2e8f0'; ctx.font=`bold 18px sans-serif`; ctx.textAlign='center';
    ctx.fillText(total, cx, cy+4);
    ctx.fillStyle='#64748b'; ctx.font='10px sans-serif';
    ctx.fillText('合計', cx, cy+18);
    // Legend
    const lx = W * 0.72, startY = cy - (labels.length * 18)/2;
    labels.forEach((lbl, i) => {
      const y = startY + i * 20;
      ctx.fillStyle = colors[i % colors.length];
      ctx.fillRect(lx, y-7, 12, 10);
      ctx.fillStyle = '#94a3b8'; ctx.font='11px sans-serif'; ctx.textAlign='left';
      ctx.fillText(`${lbl} (${data[i]})`, lx+16, y+2);
    });
  },

  // Horizontal bar chart
  hbar(canvasId, {labels, datasets}) {
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth || 500;
    const H = canvas.height = parseInt(canvas.getAttribute('height'))||120;
    ctx.clearRect(0,0,W,H);
    const data = datasets[0].data;
    const colors = Array.isArray(datasets[0].backgroundColor) ? datasets[0].backgroundColor : [datasets[0].backgroundColor];
    const maxV = Math.max(...data) * 1.2 || 1;
    const padL = 60, padR = 20, padT = 10, barH = Math.floor((H - padT*2) / labels.length) - 4;
    labels.forEach((lbl, i) => {
      const y = padT + i * (barH + 4);
      const barW = ((data[i]||0) / maxV) * (W - padL - padR);
      const color = colors[i % colors.length] || '#3b82f6';
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(padL, y, barW, barH, 3) : ctx.rect(padL, y, barW, barH);
      ctx.fill();
      ctx.fillStyle='#e2e8f0'; ctx.font='11px sans-serif'; ctx.textAlign='right';
      ctx.fillText(lbl, padL-6, y + barH/2 + 4);
      ctx.fillStyle='#94a3b8'; ctx.font='11px sans-serif'; ctx.textAlign='left';
      ctx.fillText(data[i], padL + barW + 6, y + barH/2 + 4);
    });
  }
};
// Compatibility shim: replace Chart references in code
window.Chart = function(ctx, config) {
  const id = ctx.canvas ? ctx.canvas.id : (ctx.id || 'chart');
  const type = config.type;
  const {labels, datasets} = config.data;
  const opts = config.options || {};
  this._id = id;
  if(type === 'bar' && opts.indexAxis === 'y') {
    MiniChart.hbar(id, {labels, datasets});
  } else if(type === 'bar') {
    MiniChart.bar(id, {labels, datasets, options: {max: opts.scales?.y?.max}});
  } else if(type === 'doughnut') {
    MiniChart.doughnut(id, {labels, datasets});
  }
  this.destroy = function() {};
};
</script>

// =========================================

// =========================================
function navigate(page) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => {
    if (el.getAttribute('onclick') && el.getAttribute('onclick').includes(`'${page}'`)) el.classList.add('active');
  });
  const titles = {
    dashboard:'ダッシュボード', schedule:'生産スケジュール', inventory:'金型在庫・資産管理',
    maintenance:'設備メンテナンス', drawing:'図面・BOM管理', outsource:'外注管理',
    daily:'日報管理', onboarding:'オンボーディング'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  // Destroy existing charts
  Object.values(chartInstances).forEach(c => { try{c.destroy()}catch(e){} });
  chartInstances = {};
  const content = document.getElementById('content');
  content.innerHTML = '';
  const pages = {
    dashboard: renderDashboard, schedule: renderSchedule, inventory: renderInventory,
    maintenance: renderMaintenance, drawing: renderDrawing, outsource: renderOutsource,
    daily: renderDaily, onboarding: renderOnboarding
  };
  if (pages[page]) pages[page]();
}

function editSchedule(id) {
  const s = DB.schedule.find(x=>x.id===id);

function saveSchedule(id) {
  const s = DB.schedule.find(x=>x.id===id);
  s.name = document.getElementById('e-name').value;
  s.progress = parseInt(document.getElementById('e-progress').value);
  s.status = document.getElementById('e-status').value;
  s.worker = document.getElementById('e-worker').value;
  s.end = document.getElementById('e-end').value;
  closeModal(); renderSchedule();
}

function deleteSchedule(id) {
  DB.schedule = DB.schedule.filter(x=>x.id!==id);
  closeModal(); renderSchedule();
}

      </div>
      <div class="progress-bar" style="margin-bottom:14px"><div class="progress-fill" style="width:${pct}%;background:${pct===100?'var(--green)':'var(--accent)'}"></div></div>
      ${ob.steps.map((step,i)=>`
        <div class="onboard-step">
          <div class="step-num ${step.done?'done':i===done?'':'pending'}">${step.done?'✓':i+1}</div>
          <div>
            <div style="font-size:13px;font-weight:600;color:${step.done?'var(--text3)':'var(--text)'};text-decoration:${step.done?'line-through':''}">${step.label}</div>
          </div>
          <div style="margin-left:auto">
            ${!step.done&&i===done?`<button class="btn btn-primary btn-sm" onclick="completeStep(${ob.id},${i})">完了にする</button>`:''}
            ${step.done?'<span style="color:var(--green);font-size:12px">✓ 完了</span>':''}
          </div>
        </div>`).join('')}
    </div>`;
  }).join('')}`;
}

function completeStep(obId, stepIdx) {
  const ob = DB.onboarding.find(x=>x.id===obId);
  ob.steps[stepIdx].done = true;
  ob.progress = Math.round(ob.steps.filter(s=>s.done).length/ob.steps.length*100);
  renderOnboarding();
}

function openAddOnboard() {
  openModal('新入社員登録', `
    <div class="form-grid">
      <div class="form-group"><label>氏名</label><input id="ob-name"></div>
      <div class="form-group"><label>部署</label><select id="ob-dept"><option>加工課</option><option>設計課</option><option>品質管理</option><option>総務</option></select></div>
      <div class="form-group"><label>入社日</label><input id="ob-start" type="date"></div>
      <div class="form-group"><label>メンター担当者</label><input id="ob-mentor"></div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
     <button class="btn btn-primary" onclick="addOnboard()">登録</button>`);
}

function addOnboard() {
  DB.onboarding.push({
    id: DB.onboarding.length+1,
    name: document.getElementById('ob-name').value,
    dept: document.getElementById('ob-dept').value,
    startdate: document.getElementById('ob-start').value,
    mentor: document.getElementById('ob-mentor').value,
    progress: 0,
    steps:[
      {label:'安全教育（全体）',done:false},
      {label:'設備操作マニュアル閲覧',done:false},
      {label:'現場OJT研修',done:false},
      {label:'確認テスト',done:false},
      {label:'上長承認',done:false}
    ]
  });
  closeModal(); renderOnboarding();
}

function maintenanceStatusBadge(s) {

// =========================================
// TAB HELPER
// =========================================
function switchTab(el, tabId) {
  el.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const parent = el.parentElement.nextElementSibling;
  // find all siblings
  let sibling = el.parentElement.nextElementSibling;
  while(sibling) {
    if(sibling.id && sibling.id.startsWith('tab-')) sibling.classList.add('hidden');
    sibling = sibling.nextElementSibling;
  }
  document.getElementById(tabId).classList.remove('hidden');
}

// =========================================
// MODAL
// =========================================
function openModal(title, body, footer) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = footer || '<button class="btn btn-secondary" onclick="closeModal()">閉じる</button>';
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(e) {
  if(!e || e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.add('hidden');
}

// =========================================
// CLOCK & INIT
// =========================================
function updateClock() {
  const now = new Date();
  document.getElementById('current-time').textContent = now.toLocaleString('ja-JP',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('lastupdate').textContent = now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}
updateClock();
setInterval(updateClock, 30000);
navigate('dashboard');
</script>
